---
services:
  redis:
    image: "redis:${REDIS_VERSION:-7.0.4}"
    command: ["redis-server", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 30s
      timeout: 3s
      retries: 10
    restart: on-failure
    volumes:
      - redis:/data
    networks:
      - default
    # ports:
    #   - 6379:6379
  mysql:
    image: "mariadb:${MARIADB_VERSION:-10}"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-CHANGEME}
      - MYSQL_DATABASE=scoring_engine
      - MYSQL_USER=se_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-CHANGEME}
    restart: on-failure
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 3s
      retries: 10
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - default
    # ports:
    #   - 3306:3306
  nginx:
    image: "nginx:${NGINX_VERSION:-1.27.3-alpine3.20-slim}"
    depends_on:
      web:
        condition: service_healthy
    ports:
      - 80:80
      - 443:443
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 3s
      retries: 10
    restart: on-failure
    volumes:
      - ./docker/nginx/files/web.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/files/scoringengine.crt:/etc/nginx/scoringengine.crt
      - ./docker/nginx/files/scoringengine.key:/etc/nginx/scoringengine.key
      - ./scoring_engine/web/static/:/usr/share/nginx/html/static/
    networks:
      - default
  base:
    image: scoringengine/base
    build:
      context: .
      dockerfile: ./docker/base/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14.3-slim-bookworm}
      cache_from:
        - scoringengine/base
        - base:latest
  bootstrap:
    image: scoringengine/bootstrap
    build:
      context: .
      dockerfile: ./docker/bootstrap/Dockerfile
      args:
        BASE_IMAGE: scoringengine/base
      cache_from:
        - scoringengine/bootstrap
        - bootstrap:latest
    depends_on:
      base:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: on-failure
    networks:
      - default
    environment:
      - SCORINGENGINE_EXAMPLE
      - SCORINGENGINE_OVERWRITE_DB
      - SCORINGENGINE_VERSION
      # Flask session signing key -- see .env.example. Every process that builds
      # the Flask app needs the same value, otherwise sessions break between
      # them and on restart.
      - SCORINGENGINE_SECRET_KEY
  engine:
    image: scoringengine/engine
    build:
      context: .
      dockerfile: ./docker/engine/Dockerfile
      args:
        BASE_IMAGE: scoringengine/base
      cache_from:
        - scoringengine/engine
        - engine:latest
    depends_on:
      base:
        condition: service_started
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    restart: on-failure
    networks:
      - default
    volumes:
      - check_outputs:/var/check_outputs
    environment:
      - SCORINGENGINE_EXAMPLE
      - SCORINGENGINE_VERSION
      - SCORINGENGINE_SECRET_KEY
  worker:
    image: scoringengine/worker
    build:
      context: .
      dockerfile: ./docker/worker/Dockerfile
      args:
        BASE_IMAGE: scoringengine/base
        INSTALL_CERTIPY: ${INSTALL_CERTIPY:-false}
      cache_from:
        - scoringengine/worker
        - worker:latest
    depends_on:
      base:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Run a real init as PID 1 (tini) so any orphaned check subprocesses get
    # reaped. Without this the worker python is PID 1 and never reaps, so hung
    # checks that get orphaned pile up as zombies. The process-group kill in
    # execute_command stops most orphaning at the source; this is the backstop.
    init: true
    networks:
      - default
    environment:
      - SCORINGENGINE_VERSION
      - DISPLAY=:1
    privileged: true
  web:
    image: scoringengine/web
    build:
      context: .
      dockerfile: ./docker/web/Dockerfile
      args:
        BASE_IMAGE: scoringengine/base
      cache_from:
        - scoringengine/web
        - web:latest
    depends_on:
      base:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      # Readiness: the app answers AND can reach its database and Redis.
      # Served on uwsgi's loopback-only HTTP socket (see docker/web/Dockerfile).
      #
      # nginx gates its own start on `web: condition: service_healthy`, so these
      # timings decide how long the whole stack waits at boot and how much
      # dependency flapping it tolerates before compose gives up.
      #
      # start_period: readiness (unlike the old liveness probe) fails until
      #   MariaDB and Redis are actually answering queries. Failures inside this
      #   window do not count against `retries`, so a slow database start can no
      #   longer burn the retry budget before the app is legitimately ready.
      #   90s covers importing Flask/SQLAlchemy, forking four uWSGI workers and
      #   opening the first DB/Redis connections on a cold, disk-bound host.
      # interval: dropped 30s -> 10s. Docker fires the first probe only after
      #   one interval, so this is also how long nginx sits idle behind an
      #   already-ready web container. The probe is a `SELECT 1` plus a Redis
      #   PING, so 10s costs nothing. (Deliberately not using `start_interval`,
      #   which would be the tidier tool here: it needs Docker Engine 25+, and
      #   airgapped competition hosts are frequently older than that.)
      # timeout: 3s -> 5s. The probe now does two network round-trips through a
      #   worker pool that is also serving competition traffic; 3s was sized for
      #   a static stats page.
      # retries: 10 x 10s = 100s of sustained dependency failure after startup
      #   before the container is marked unhealthy.
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5001/health/ready"]
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 10
    restart: on-failure
    networks:
      - default
    volumes:
      - injects:/var/uploads/
      - check_outputs:/var/check_outputs
    environment:
      - SCORINGENGINE_VERSION
      # Flask session signing key. Required to scale this service past one
      # replica and to keep users logged in across restarts. See .env.example.
      - SCORINGENGINE_SECRET_KEY

volumes:
  check_outputs:
  injects:
  redis:
  mysql:

networks:
  default:
    driver_opts:
      # Containers default to MTU 1500 regardless of the host's uplink. When
      # scored hosts sit behind a lower-MTU path (OpenStack/VXLAN, GRE, IPsec)
      # and their firewalls drop ICMP "fragmentation needed", large replies
      # are silently lost: TCP connects, then TLS/HTTP checks hang until
      # timeout while small-packet services (SSH) keep passing. Set
      # DOCKER_NETWORK_MTU in .env (e.g. 1400) to match the path MTU.
      com.docker.network.driver.mtu: ${DOCKER_NETWORK_MTU:-1500}
